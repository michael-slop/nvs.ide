name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  NVIM_VERSION: v0.12.1
  # nvim-linux-x86_64.tar.gz of NVIM_VERSION; Neovim publishes no checksum file, this is the
  # digest GitHub shows for the release asset (scripts/package.sh pins the same one).
  NVIM_LINUX_SHA256: ab757a1fd9ad307d53d2df4045698906a7ca3993d92260dd8fe49108712d57d0

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Neovim (the release zip; winget is unreliable on runners)
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'nvim-win64.zip'
          Invoke-WebRequest -Uri "https://github.com/neovim/neovim/releases/download/$env:NVIM_VERSION/nvim-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'nvim')
          Join-Path $env:RUNNER_TEMP 'nvim\nvim-win64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Versions
        run: |
          nvim --version | Select-Object -First 1
          cargo --version
          rustc --version
          node --version

      - name: Build the window (release)
        working-directory: shell
        run: cargo build --release

      - name: Test the window (unit tests and the headless attach test)
        working-directory: shell
        run: cargo test --release

      - name: Extension host tests
        if: hashFiles('tests/exthost/run.mjs') != ''
        run: node tests/exthost/run.mjs

      - name: Lua syntax (loadfile compiles every Lua file without running it)
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'lua_syntax.lua'
          @'
          local files = {}
          for _, pattern in ipairs({ "runtime/**/*.lua", "tests/**/*.lua", "shell/src/**/*.lua" }) do
            vim.list_extend(files, vim.fn.glob(pattern, true, true))
          end
          local bad = 0
          for _, f in ipairs(files) do
            local fn, err = loadfile(f)
            if not fn then
              bad = bad + 1
              io.stderr:write(err .. "\n")
            end
          end
          io.write(("%d Lua files, %d with syntax errors\n"):format(#files, bad))
          os.exit(bad == 0 and 0 or 1)
          '@ | Set-Content -Path $script -Encoding utf8
          nvim --clean --headless -c "luafile $script"

      - name: Health check provider (:checkhealth nvs, no plugins)
        run: |
          $runtime = (Join-Path $PWD.Path 'runtime') -replace '\\', '/'
          nvim --clean --headless --cmd "set rtp^=$runtime" -c "luafile tests/verify_health.lua"

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # The build needs none of these: winit and wgpu open the X11, Wayland and Vulkan
      # libraries at run time. The screenshot step does: Xvfb for a display, Mesa's
      # software Vulkan (lavapipe) and OpenGL (llvmpipe) for a GPU, and the X11 and
      # xkbcommon libraries winit loads. unzip is how extensions unpack on Linux.
      - name: System packages for the screenshot
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers libvulkan1 libegl1 libgl1-mesa-dri \
            libx11-6 libx11-xcb1 libxcursor1 libxi6 libxrandr2 libxkbcommon0 libxkbcommon-x11-0 unzip \
            xclip weston libwayland-client0 libwayland-cursor0 libwayland-egl1 desktop-file-utils

      - name: Neovim (the release tarball, checked against its pinned sha256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nvim.tar.gz" "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_LINUX_SHA256  $RUNNER_TEMP/nvim.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          nvim --version | head -1
          cargo --version
          rustc --version
          node --version

      - name: Build the window (release)
        working-directory: shell
        run: cargo build --release

      - name: Test the window (unit tests and the headless attach test)
        working-directory: shell
        run: cargo test --release

      - name: Extension host tests
        run: node tests/exthost/run.mjs

      - name: Health check provider (:checkhealth nvs, no plugins)
        run: nvim --clean --headless --cmd "set rtp^=$PWD/runtime" -c "luafile tests/verify_health.lua"

      - name: Runtime checks (LazyVim installed into a sandbox, then every verify_*.lua)
        run: bash tests/run.sh --sandbox "$RUNNER_TEMP/nvs-sb"

      # The window, offscreen, in the sandbox the runtime checks just filled: it starts
      # Neovim, draws the workbench and writes a PNG, and the check fails a blank frame.
      - name: Screenshot of the window (Xvfb, software Vulkan)
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/nvs-sb/config
          XDG_DATA_HOME: ${{ runner.temp }}/nvs-sb/data
          XDG_STATE_HOME: ${{ runner.temp }}/nvs-sb/state
          XDG_CACHE_HOME: ${{ runner.temp }}/nvs-sb/cache
          NVS_TEST: '1'
        run: |
          timeout 180 xvfb-run -a -s "-screen 0 1920x1080x24" \
            shell/target/release/nvs-ide --startuptime --screenshot "$RUNNER_TEMP/nvs-ide-linux.png"
          python3 tests/screenshot_check.py "$RUNNER_TEMP/nvs-ide-linux.png"

      # The window serves Neovim's clipboard (shell/src/clipboard.rs). The probe runs inside
      # it: Neovim must pick the window's provider, a copy must read back, xclip must see
      # what the window copied, and the window must see what xclip copied.
      - name: Clipboard served by the window (X11)
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/nvs-sb/config
          XDG_DATA_HOME: ${{ runner.temp }}/nvs-sb/data
          XDG_STATE_HOME: ${{ runner.temp }}/nvs-sb/state
          XDG_CACHE_HOME: ${{ runner.temp }}/nvs-sb/cache
          NVS_TEST: '1'
          NVS_PROBE_OUT: ${{ runner.temp }}/clipboard-x11.txt
        run: |
          timeout 180 xvfb-run -a -s "-screen 0 1920x1080x24" \
            shell/target/release/nvs-ide --send ':luafile tests/clipboard_probe.lua<CR>' --screenshot "$RUNNER_TEMP/nvs-ide-clipboard.png"
          cat "$NVS_PROBE_OUT"
          grep -qx 'provider=nvs-ide' "$NVS_PROBE_OUT"
          grep -qx 'roundtrip=nvs clipboard round trip' "$NVS_PROBE_OUT"
          grep -qx 'xclip_sees=nvs clipboard round trip' "$NVS_PROBE_OUT"
          grep -qx 'window_sees=copied by xclip' "$NVS_PROBE_OUT"

      # Wayland, under a headless Weston: the window must start as a native Wayland client
      # (no DISPLAY, so no XWayland to fall back on), open the Wayland clipboard through its
      # own connection, and draw a real frame.
      - name: Wayland (headless Weston)
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/nvs-sb/config
          XDG_DATA_HOME: ${{ runner.temp }}/nvs-sb/data
          XDG_STATE_HOME: ${{ runner.temp }}/nvs-sb/state
          XDG_CACHE_HOME: ${{ runner.temp }}/nvs-sb/cache
          NVS_TEST: '1'
          NVS_PROBE_OUT: ${{ runner.temp }}/clipboard-wayland.txt
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-nvs --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          for i in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wayland-nvs" ] && break; sleep 0.2; done
          [ -S "$XDG_RUNTIME_DIR/wayland-nvs" ] || { cat "$RUNNER_TEMP/weston.log"; exit 1; }
          env -u DISPLAY WAYLAND_DISPLAY=wayland-nvs timeout 180 \
            shell/target/release/nvs-ide --send ':luafile tests/clipboard_probe.lua<CR>' \
            --screenshot "$RUNNER_TEMP/nvs-ide-wayland.png" 2>&1 | tee "$RUNNER_TEMP/wayland.log"
          python3 tests/screenshot_check.py "$RUNNER_TEMP/nvs-ide-wayland.png"
          grep -q 'clipboard: Wayland' "$RUNNER_TEMP/wayland.log"
          cat "$NVS_PROBE_OUT"
          grep -qx 'provider=nvs-ide' "$NVS_PROBE_OUT"
          # A headless compositor has no keyboard focus to grant a selection, so a Wayland
          # round trip is reported here, not required; a desktop session is the real test.
          grep -E '^roundtrip(_error)?=' "$NVS_PROBE_OUT"

      # What a user downloads: the tarball from scripts/package.sh, unpacked into a folder
      # with a space and an & in its name, installed with install.sh into a throwaway HOME,
      # started from there (it must find its bundled Neovim and the house font next to
      # itself), then uninstalled, which must leave nothing behind.
      - name: Package, install, start and uninstall (the user's path)
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/nvs-sb/config
          XDG_DATA_HOME: ${{ runner.temp }}/nvs-sb/data
          XDG_STATE_HOME: ${{ runner.temp }}/nvs-sb/state
          XDG_CACHE_HOME: ${{ runner.temp }}/nvs-sb/cache
          NVS_TEST: '1'
        run: |
          bash scripts/package.sh 0.0.0-ci --no-build
          fake="$RUNNER_TEMP/home"
          dir="$RUNNER_TEMP/apps & more"
          mkdir -p "$fake" "$dir"
          tar -xzf dist/nvs.ide-0.0.0-ci-linux-x86_64.tar.gz -C "$dir"
          app="$dir/nvs.ide"
          # install.sh's own paths come from HOME, not the sandbox's XDG_DATA_HOME.
          env -u XDG_DATA_HOME HOME="$fake" sh "$app/install.sh"
          test "$(readlink -f "$fake/.local/bin/nvs")" = "$app/nvs"
          test "$(readlink -f "$fake/.local/bin/nvs-ide")" = "$app/nvs-ide"
          desktop-file-validate "$fake/.local/share/applications/nvs-ide.desktop"
          grep -qxF "Exec=\"$app/nvs-ide\" %F" "$fake/.local/share/applications/nvs-ide.desktop"
          test -f "$fake/.local/share/icons/hicolor/64x64/apps/nvs-ide.png"
          HOME="$fake" "$fake/.local/bin/nvs" --version | tee "$RUNNER_TEMP/version.txt"
          grep -qF "$app/nvim/bin/nvim (bundled)" "$RUNNER_TEMP/version.txt"
          timeout 180 xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$fake/.local/bin/nvs-ide" --screenshot "$RUNNER_TEMP/nvs-ide-installed.png" 2>&1 | tee "$RUNNER_TEMP/installed.log"
          grep -q 'primary font: BigBlueTerm437 Nerd Font Mono' "$RUNNER_TEMP/installed.log"
          grep -q 'using the bundled Neovim' "$RUNNER_TEMP/installed.log"
          python3 tests/screenshot_check.py "$RUNNER_TEMP/nvs-ide-installed.png"
          env -u XDG_DATA_HOME HOME="$fake" sh "$app/install.sh" --uninstall
          # update-desktop-database leaves its regenerated mimeinfo.cache; that is the
          # desktop's index, not a file of ours.
          left=$(find "$fake/.local" \( -type f -o -type l \) ! -name '*.cache' | wc -l)
          echo "left behind: $left"
          test "$left" -eq 0

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nvs-ide-linux-screenshots
          path: ${{ runner.temp }}/nvs-ide-*.png
          if-no-files-found: ignore
